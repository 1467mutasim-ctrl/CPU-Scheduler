<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .wire { fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .v33  { stroke:#dc2626; }
    .gnd  { stroke:#111827; }
    .sda  { stroke:#2563eb; }
    .scl  { stroke:#eab308; }
    .sck  { stroke:#16a34a; }
    .mosi { stroke:#9333ea; }
    .rst  { stroke:#f97316; }
    .dc   { stroke:#0891b2; }
    .btn  { stroke:#64748b; }
    .pad  { fill:#d4a017; stroke:#7c5a00; stroke-width:1.5; }
    .gp   { font-family:Consolas, Menlo, monospace; font-size:11px; fill:#f8fafc; }
    .pl   { font-family:Consolas, Menlo, monospace; font-size:8px; fill:#e0e7ff; }
    .cap  { font-size:13px; font-weight:600; fill:#1f2937; }
    .note { font-size:12px; fill:#4b5563; }
    .leg  { font-size:12px; fill:#1f2937; }
  </style>
  <rect width="1100" height="720" fill="#f4f4f0"/>

  <text x="30" y="30" font-size="18" font-weight="700" fill="#111827">Wiring diagram</text>
  <text x="170" y="30" class="note">CPU Scheduler Visualizer · all modules run from 3V3</text>

  <!-- ===== power rails ===== -->
  <line x1="30" y1="60" x2="1070" y2="60" stroke="#dc2626" stroke-width="7" stroke-opacity=".35"/>
  <line x1="30" y1="84" x2="1070" y2="84" stroke="#111827" stroke-width="7" stroke-opacity=".3"/>
  <text x="30" y="52" font-size="12" font-weight="700" fill="#dc2626">3V3</text>
  <text x="48" y="102" font-size="12" font-weight="700" fill="#111827">GND</text>

  <!-- ===== modules (bodies) ===== -->
  <!-- OLED -->
  <rect x="80" y="140" width="200" height="120" rx="6" fill="#1d4ed8"/>
  <rect x="95" y="174" width="170" height="76" rx="2" fill="#0b1020"/>
  <text x="180" y="217" text-anchor="middle" font-size="11" fill="#7dd3fc" font-family="Consolas, Menlo, monospace">ALGORITHM</text>
  <text x="180" y="280" text-anchor="middle" class="cap">SSD1306 0.96" OLED (I²C)</text>

  <!-- ST7789 -->
  <rect x="800" y="140" width="200" height="240" rx="6" fill="#1d4ed8"/>
  <rect x="815" y="175" width="170" height="170" rx="2" fill="#0b1020"/>
  <text x="900" y="266" text-anchor="middle" font-size="11" fill="#7dd3fc" font-family="Consolas, Menlo, monospace">240×240 IPS</text>
  <text x="900" y="400" text-anchor="middle" class="cap">ST7789 1.3" IPS (SPI, no CS)</text>

  <!-- ESP32 -->
  <rect x="430" y="240" width="240" height="410" rx="10" fill="#111827"/>
  <path d="M510,262 h12 v10 h12 v-10 h12 v10 h12 v-10 h12 v10 h14" fill="none" stroke="#d4a017" stroke-width="2"/>
  <rect x="505" y="278" width="90" height="88" rx="3" fill="#d1d5db"/>
  <text x="550" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">ESP32</text>
  <text x="550" y="626" text-anchor="middle" font-size="12" fill="#cbd5e1">ESP32 DevKit</text>
  <rect x="525" y="642" width="50" height="20" rx="4" fill="#9ca3af"/>
  <text x="550" y="680" text-anchor="middle" class="note">USB-C (programming / power)</text>

  <!-- buttons -->
  <g id="button">
    <rect x="283" y="393" width="34" height="34" rx="3" fill="#334155"/>
    <circle cx="300" cy="410" r="11" fill="#9ca3af"/>
  </g>
  <use href="#button" y="50"/>
  <use href="#button" y="100"/>
  <use href="#button" y="150"/>

  <!-- ===== wires ===== -->
  <!-- OLED -->
  <path class="wire gnd" d="M140,150 V84"/>
  <path class="wire v33" d="M160,150 V60"/>
  <path class="wire scl" d="M180,150 V110 H410 V340 H442"/>
  <path class="wire sda" d="M200,150 V125 H395 V300 H442"/>

  <!-- ST7789 power -->
  <path class="wire gnd" d="M830,150 V84"/>
  <path class="wire v33" d="M852,150 V60"/>
  <path class="wire v33" d="M962,150 V60"/>
  <!-- ST7789 signals (hop over the power wires) -->
  <path class="wire dc"   d="M940,150 V100 H858 A6,6 0 0 0 846,100 H836 A6,6 0 0 0 824,100 H690 V300 H658"/>
  <path class="wire rst"  d="M918,150 V110 H858 A6,6 0 0 0 846,110 H836 A6,6 0 0 0 824,110 H710 V340 H658"/>
  <path class="wire mosi" d="M896,150 V120 H858 A6,6 0 0 0 846,120 H836 A6,6 0 0 0 824,120 H730 V380 H658"/>
  <path class="wire sck"  d="M874,150 V130 H858 A6,6 0 0 0 846,130 H836 A6,6 0 0 0 824,130 H750 V420 H658"/>

  <!-- ESP32 power -->
  <path class="wire v33" d="M658,560 H1045 V60"/>
  <path class="wire gnd" d="M658,600 H1060 V84"/>

  <!-- buttons: GND bus + signal legs -->
  <path class="wire gnd" d="M40,84 V620 H200 V410"/>
  <path class="wire gnd" d="M200,410 H283 M200,460 H283 M200,510 H283 M200,560 H283"/>
  <path class="wire btn" d="M317,410 H442 M317,460 H442 M317,510 H442 M317,560 H442"/>
  <circle cx="200" cy="460" r="4" fill="#111827"/>
  <circle cx="200" cy="510" r="4" fill="#111827"/>
  <circle cx="200" cy="560" r="4" fill="#111827"/>
  <text x="241" y="403" text-anchor="middle" class="leg" font-weight="600">UP</text>
  <text x="241" y="453" text-anchor="middle" class="leg" font-weight="600">DOWN</text>
  <text x="241" y="503" text-anchor="middle" class="leg" font-weight="600">OK</text>
  <text x="241" y="553" text-anchor="middle" class="leg" font-weight="600">BACK</text>
  <text x="120" y="644" text-anchor="middle" class="note">4 × tactile push button</text>

  <!-- ===== pins & pads (on top of wires) ===== -->
  <!-- OLED header: GND VDD SCK SDA -->
  <g class="pad"><circle cx="140" cy="150" r="5"/><circle cx="160" cy="150" r="5"/><circle cx="180" cy="150" r="5"/><circle cx="200" cy="150" r="5"/></g>
  <g class="pl" text-anchor="middle"><text x="140" y="167">GND</text><text x="160" y="167">VDD</text><text x="180" y="167">SCK</text><text x="200" y="167">SDA</text></g>

  <!-- ST7789 header: GND VCC SCL SDA RES DC BLK -->
  <g class="pad"><circle cx="830" cy="150" r="5"/><circle cx="852" cy="150" r="5"/><circle cx="874" cy="150" r="5"/><circle cx="896" cy="150" r="5"/><circle cx="918" cy="150" r="5"/><circle cx="940" cy="150" r="5"/><circle cx="962" cy="150" r="5"/></g>
  <g class="pl" text-anchor="middle"><text x="830" y="167">GND</text><text x="852" y="167">VCC</text><text x="874" y="167">SCL</text><text x="896" y="167">SDA</text><text x="918" y="167">RES</text><text x="940" y="167">DC</text><text x="962" y="167">BLK</text></g>

  <!-- ESP32 left pads -->
  <g class="pad"><circle cx="442" cy="300" r="6"/><circle cx="442" cy="340" r="6"/><circle cx="442" cy="410" r="6"/><circle cx="442" cy="460" r="6"/><circle cx="442" cy="510" r="6"/><circle cx="442" cy="560" r="6"/></g>
  <g class="gp"><text x="454" y="304">GPIO21</text><text x="454" y="344">GPIO22</text><text x="454" y="414">GPIO26</text><text x="454" y="464">GPIO32</text><text x="454" y="514">GPIO27</text><text x="454" y="564">GPIO25</text></g>
  <!-- ESP32 right pads -->
  <g class="pad"><circle cx="658" cy="300" r="6"/><circle cx="658" cy="340" r="6"/><circle cx="658" cy="380" r="6"/><circle cx="658" cy="420" r="6"/><circle cx="658" cy="560" r="6"/><circle cx="658" cy="600" r="6"/></g>
  <g class="gp" text-anchor="end"><text x="646" y="304">GPIO2</text><text x="646" y="344">GPIO4</text><text x="646" y="384">GPIO23</text><text x="646" y="424">GPIO18</text><text x="646" y="564">3V3</text><text x="646" y="604">GND</text></g>

  <!-- ===== legend ===== -->
  <rect x="780" y="414" width="250" height="118" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <g class="leg">
    <line x1="794" y1="432" x2="814" y2="432" class="wire v33"/><text x="820" y="436">3V3</text>
    <line x1="794" y1="452" x2="814" y2="452" class="wire gnd"/><text x="820" y="456">GND</text>
    <line x1="794" y1="472" x2="814" y2="472" class="wire sda"/><text x="820" y="476">OLED SDA</text>
    <line x1="794" y1="492" x2="814" y2="492" class="wire scl"/><text x="820" y="496">OLED SCK</text>
    <line x1="904" y1="432" x2="924" y2="432" class="wire sck"/><text x="930" y="436">TFT SCL</text>
    <line x1="904" y1="452" x2="924" y2="452" class="wire mosi"/><text x="930" y="456">TFT SDA</text>
    <line x1="904" y1="472" x2="924" y2="472" class="wire rst"/><text x="930" y="476">TFT RES</text>
    <line x1="904" y1="492" x2="924" y2="492" class="wire dc"/><text x="930" y="496">TFT DC</text>
    <line x1="794" y1="514" x2="814" y2="514" class="wire btn"/><text x="820" y="518">Button signal</text>
  </g>

  <text x="30" y="710" class="note">Pads are drawn by function, not physical position. Find each GPIO by the label printed on your DevKit.</text>
</svg>
